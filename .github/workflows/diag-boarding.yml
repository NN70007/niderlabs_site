name: diag-boarding
on:
  workflow_dispatch:
    inputs:
      q:
        description: 'requête (ex. a=adiag&n=LG8257&d=2026-11-08)'
        default: 'a=conso'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://script.google.com/macros/s/AKfycbwjfALtYam9glF9Rb9pF_5IuImyFI4tler3PUiHPXBy5L3GOR-hItwuS33eI2wRHUQiAg/exec'
          echo "RESULT $(curl -sL -m 60 "$U?${{ inputs.q }}")"
