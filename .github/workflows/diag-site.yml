name: diag-site
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://niderlabs.com/boarding
          echo "VJSON $(curl -s $B/version.json?x=$RANDOM)"
          curl -s "$B/?x=$RANDOM" -o i.html; echo "IDX $(grep -o 'v=[0-9]*' i.html | sort -u | tr '\n' ' ') cg=$(grep -c cg-retour i.html)"
          curl -s "$B/boarding.js?v=40" -o b.js; echo "JS $(wc -c < b.js) $(grep -o 'VERSION = "[0-9]*"' b.js) cg=$(grep -c cg-retour b.js)"
          node -e "new Function(require('fs').readFileSync('b.js','utf8'));console.log('SYNTAX ok')"
          curl -sI "$B/boarding.css?v=40" | head -1 | sed 's/^/CSS /'
          A=https://niderlabs.com/aviator
          curl -s "$A/?x=$RANDOM" -o a.html; echo "AVIATOR IDX $(grep -o 'aviator.js?v=[0-9]*' a.html) qr=$(grep -c 'Scan its QR' a.html)"
          curl -s "$A/aviator.js?v=7" -o a.js; echo "AVIATOR JS $(wc -c < a.js) qr=$(grep -c 'niderlabs.com/A/' a.js)"
          node -e "new Function(require('fs').readFileSync('a.js','utf8'));console.log('AVIATOR SYNTAX ok')"
          curl -sI "https://niderlabs.com/A/123456" | grep -i -E '^(HTTP|location)' | sed 's/^/QR /'
          curl -s "$A/?x=$RANDOM" -o r.html; echo "RECIT $(grep -o 'recit.js?v=[0-9]*' r.html) $(grep -o 'aviator.css?v=[0-9]*' r.html | head -1) calc=$(grep -c recit-calc r.html)"
          curl -s "$A/recit.js?v=4" -o r.js; echo "RECIT JS $(wc -c < r.js) qnh=$(grep -c 'titre: \"QNH\"' r.js) calc=$(grep -c 'calc: 1' r.js)"
          curl -s "$A/aviator.css?v=15" | grep -c 'recit-calc' | sed 's/^/RECIT CSS /'
